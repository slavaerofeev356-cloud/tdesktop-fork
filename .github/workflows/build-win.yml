name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Fix ATL include path for MSVC
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1).Trim()
          Write-Host "Visual Studio: $vsPath"
          $legacy = Join-Path $vsPath 'VC\atlmfc'
          if (Test-Path (Join-Path $legacy 'include\atlbase.h')) { Write-Host "ATL legacy path already present"; exit 0 }
          $atl = Get-ChildItem -Path (Join-Path $vsPath 'VC') -Recurse -Filter 'atlbase.h' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $atl) { Write-Host "ATL not found"; exit 1 }
          $atlDir = $atl.Directory.Parent.FullName
          Write-Host "ATL dir: $atlDir"
          if (Test-Path $legacy) { Remove-Item $legacy -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Junction -Path $legacy -Target $atlDir | Out-Null
          Write-Host "Junction created: $legacy -> $atlDir"
          Test-Path (Join-Path $legacy 'include\atlbase.h')

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: "14.44"

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Telegram Desktop build
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c -D CMAKE_CONFIGURATION_TYPES=Release -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ..\out --config Release --parallel

      - name: Package portable
        run: |
          cd %TBUILD%\%REPO_NAME%
          powershell -Command "Compress-Archive -Path out\Release\* -DestinationPath %TBUILD%\TelegramDesktop-win64.zip -Force"

      - uses: actions/upload-artifact@v4
        name: Upload artifact
        with:
          name: Telegram-win64
          path: ${{ env.TBUILD }}\TelegramDesktop-win64.zip
          retention-days: 7
